<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mote</title>
<meta name="description" content="Opens your dgsp32 dongle when it's nearby, otherwise the mote keyboard.">
<style>
:root{
  --bg:#f4f4f3; --fg:#18181b; --mut:#8a8a93; --line:#e4e4e7;
  --accent:#16a34a; --accent2:#4ade80; --card:#ffffff;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0b0b0d; --fg:#f4f4f5; --mut:#8b8b93; --line:#242427; --card:#141417;}
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:24px 16px; text-align:center; -webkit-tap-highlight-color:transparent;
}
.wrap{display:flex; flex-direction:column; align-items:center; gap:22px; max-width:340px}

/* The made-this badge: emblem + wordmark, the whole thing is the link. */
a.brand{
  text-decoration:none; color:inherit; display:flex; flex-direction:column;
  align-items:center; gap:16px; padding:10px; border-radius:20px;
  transition:transform .15s ease;
}
a.brand:active{transform:scale(.97)}
.emblem{width:132px; height:132px; display:block; filter:drop-shadow(0 10px 24px rgba(0,0,0,.14))}
/* pixel chips that drift up out of the cube while searching */
.chip{opacity:0; transform-box:fill-box; transform-origin:center}
.searching .chip{animation:rise 2.6s ease-in-out infinite}
.searching .chip:nth-child(2){animation-delay:.5s}
.searching .chip:nth-child(3){animation-delay:1.1s}
.searching .chip:nth-child(4){animation-delay:1.7s}
@keyframes rise{
  0%{opacity:0; transform:translateY(6px)}
  25%{opacity:1}
  70%{opacity:.5; transform:translateY(-10px)}
  100%{opacity:0; transform:translateY(-16px)}
}
.word{font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1}
.word b{color:var(--accent); font-weight:800}
.tag{font-size:14px; color:var(--mut); margin-top:-6px}

.hint{font-size:13px; color:var(--mut); display:flex; align-items:center; gap:8px}
.dot{width:8px; height:8px; border-radius:50%; background:var(--accent)}
.searching .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25; transform:scale(.8)}50%{opacity:1; transform:scale(1.25)}}
.cta{font-size:13px; color:var(--mut)}
.cta a{color:var(--accent); text-decoration:none; font-weight:600}
</style>

<div class="wrap searching" id="wrap">
  <a class="brand" href="https://mote.dunc.app" id="brand" aria-label="Open the mote keyboard">
    <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
      <!-- isometric cube: a small made thing -->
      <polygon points="60,16 102,40 60,64 18,40" fill="var(--accent2)"/>
      <polygon points="18,40 60,64 60,112 18,88" fill="var(--accent)"/>
      <polygon points="102,40 60,64 60,112 102,88" fill="#0f7a37"/>
      <!-- top-face pixel grid -->
      <g opacity=".35" fill="#0f7a37">
        <polygon points="60,28 74,36 60,44 46,36"/>
      </g>
      <!-- drifting pixel chips (animate while searching) -->
      <rect class="chip" x="40" y="18" width="7" height="7" rx="1.5" fill="var(--accent2)"/>
      <rect class="chip" x="74" y="12" width="6" height="6" rx="1.5" fill="var(--accent)"/>
      <rect class="chip" x="58" y="6" width="8" height="8" rx="1.5" fill="var(--accent2)"/>
      <rect class="chip" x="86" y="24" width="5" height="5" rx="1.5" fill="var(--accent)"/>
    </svg>
    <div>
      <div class="word">mote<b>.</b></div>
      <div class="tag">tap to open the keyboard</div>
    </div>
  </a>

  <div class="hint" id="hint"><span class="dot"></span><span id="hintText">looking for your dongle…</span></div>
  <div class="cta">not here? the badge opens <a href="https://mote.dunc.app">mote.dunc.app</a></div>
</div>

<script>
// If the dgsp32 dongle is reachable on this network, jump straight to its page.
// Otherwise this stays a launcher: the badge opens the mote keyboard app.
//
// HOSTING: the dongle's hotspot is a private 192.168 address, so Chrome's Local
// Network Access lets even an HTTPS page reach it over HTTP - the FIRST probe
// pops a one-time "allow access to devices on your local network" prompt; click
// Allow and detection runs (the choice is remembered per site). On a plain HTTP
// host it just works. If LNA is unavailable/denied, the probe quietly fails and
// this stays the badge launcher.
(() => {
  // Use the dongle's fixed hotspot IP, not dgsp32.local: Chrome resolves .local
  // via mDNS for fetch (so a hostname probe works) but NOT for a top-level
  // navigation, which NXDOMAINs. The literal IP needs no resolution either way.
  const DONGLE = 'http://192.168.7.1/';
  const PROBE  = 'http://192.168.7.1/';   // any endpoint; we only need it to connect
  const wrap = document.getElementById('wrap');
  const hint = document.getElementById('hint');
  const hintText = document.getElementById('hintText');

  let stopped = false;

  // One probe: resolves true if the dongle answers at the network level. We use
  // no-cors (the dongle sends no CORS headers) + a timeout via AbortController;
  // an opaque resolve means "reachable", a reject/timeout means "not yet".
  function probe() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 1800);
    return fetch(PROBE, {mode: 'no-cors', cache: 'no-store', signal: ctrl.signal})
      .then(() => { clearTimeout(timer); return true; })
      .catch(() => { clearTimeout(timer); return false; });
  }

  async function loop() {
    while (!stopped) {
      if (await probe()) {
        hintText.textContent = 'found it — opening…';
        location.href = DONGLE;
        return;
      }
      await new Promise(r => setTimeout(r, 2500)); // try again shortly
    }
  }
  loop();

  // Stop probing when the tab is hidden; resume when it returns.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopped = true; }
    else if (stopped) { stopped = false; loop(); }
  });
})();
</script>
</html>
